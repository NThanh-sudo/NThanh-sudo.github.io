<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3.4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

    <div class="container" style="max-width: 600px;">
        
        <!-- Câu a) Form đăng nhập -->
        <h3 class="mb-4">a)</h3>
        <form class="mb-5">
            <div class="row mb-3 align-items-center">
                <label for="inputEmail" class="col-sm-3 col-form-label text-end">Email</label>
                <div class="col-sm-9">
                    <input type="email" class="form-control" id="inputEmail" placeholder="Email">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="inputPassword" class="col-sm-3 col-form-label text-end">Password</label>
                <div class="col-sm-9">
                    <input type="password" class="form-control" id="inputPassword" placeholder="Password">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-9 offset-sm-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gridCheck">
                        <label class="form-check-label" for="gridCheck">
                            Remember me
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3">
                    <button type="submit" class="btn btn-dark">Sign in</button>
                </div>
            </div>
        </form>

        <hr class="my-5">

        <!-- Câu b) Textarea -->
        <h3>b)</h3>
        <h2>Textarea</h2>
        <p>Dùng class .form-control để tạo kiểu cho vùng nhập văn bản</p>

        <form>
            <div class="mb-3">
                <label for="commentTextarea" class="form-label">Bình luận:</label>
                <textarea class="form-control" id="commentTextarea" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Gửi</button>
        </form>

    </div>

</body>
</html>
