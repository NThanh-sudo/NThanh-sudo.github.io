<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4.3</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        .navbar-a {
            height: 68px;
            background: #fafafa;
            padding: 0 28px;
        }

        .navbar-a .navbar-brand {
            font-size: 25px;
            font-weight: 600;
            color: #222;
            margin-right: 25px;
        }

        .navbar-a .nav-link {
            color: #555;
            font-size: 16px;
            padding: 23px 12px;
            white-space: nowrap;
        }

        .navbar-a .nav-link:hover {
            color: #222;
        }

        .search-a {
            width: 390px;
            margin-left: auto;
        }

        .search-a .form-control {
            height: 42px;
            border: 1px solid #eee;
            border-radius: 4px 0 0 4px;
        }

        .search-a .btn {
            width: 62px;
            height: 42px;
            border: 0;
            border-radius: 0 4px 4px 0;
            background: #202020;
            color: #fff;
        }

        .navbar-b {
            height: 54px;
            background: #111827;
            padding: 0 10px;
        }

        .navbar-b .navbar-brand {
            width: 42px;
            color: #fff;
            font-size: 27px;
            font-weight: 700;
            margin-right: 4px;
        }

        .navbar-b .nav-link {
            height: 54px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #f3f4f6;
            font-size: 13px;
            padding: 0 12px;
            white-space: nowrap;
        }

        .navbar-b .nav-link:hover {
            color: #fff;
            background: #1f2937;
        }

        .navbar-b .nav-link i:first-child {
            font-size: 14px;
        }

        .navbar-b .fa-chevron-down {
            font-size: 8px;
            margin-left: 2px;
        }

        .search-b {
            width: 220px;
            margin-left: auto;
        }

        .search-b .form-control {
            height: 34px;
            font-size: 11px;
            border: 0;
            border-radius: 4px 0 0 4px;
        }

        .search-b .btn {
            width: 35px;
            height: 34px;
            padding: 0;
            background: #fff;
            color: #374151;
            border: 0;
            border-radius: 0 4px 4px 0;
        }

        .right-icon {
            color: #fff;
            font-size: 14px;
            margin-left: 18px;
        }

        @media (max-width: 1100px) {
            body {
                padding: 20px;
            }

            .search-a {
                width: 300px;
            }

            .search-b {
                width: 180px;
            }
        }

        @media (max-width: 991px) {
            .navbar-a,
            .navbar-b {
                height: auto;
            }

            .navbar-a .nav-link,
            .navbar-b .nav-link {
                height: auto;
                padding: 12px;
            }

            .search-a,
            .search-b {
                width: 100%;
                margin: 10px 0;
            }

            .right-icon {
                display: inline-block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-a mb-5">

        <a class="navbar-brand" href="#">Logo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarA">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarA">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="#">Trang chủ</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Giới thiệu</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        Sản phẩm
                    </a>

                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" href="#">Điện thoại</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">Laptop</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">Phụ kiện</a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Liên hệ</a>
                </li>

            </ul>

            <form class="d-flex search-a">
                <input class="form-control" type="search" placeholder="Tìm kiếm...">
                <button class="btn" type="submit">Tìm</button>
            </form>

        </div>
    </nav>


    <nav class="navbar navbar-expand-lg navbar-b">

        <a class="navbar-brand" href="#">S</a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarB">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarB">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        Điện thoại
                        <i class="fa-solid fa-chevron-down"></i>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-laptop"></i>
                        Laptop
                        <i class="fa-solid fa-chevron-down"></i>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-desktop"></i>
                        PC, Màn hình
                        <i class="fa-solid fa-chevron-down"></i>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-regular fa-clock"></i>
                        Thiết bị đeo thông minh
                        <i class="fa-solid fa-chevron-down"></i>
                    </a>
                </li>

            </ul>

            <form class="d-flex search-b">

                <input
                    class="form-control"
                    type="search"
                    placeholder="Bạn cần tìm gì?"
                >

                <button class="btn" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </form>

            <a href="#" class="right-icon">
                <i class="fa-solid fa-user"></i>
            </a>

            <a href="#" class="right-icon">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

        </div>
    </nav>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
