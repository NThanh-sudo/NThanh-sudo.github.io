<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài 4.5</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        .navbar {
            min-height: 65px;
            padding: 8px 25px;
            border-bottom: 1px solid #eeeeee;
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 500;
            color: #555;
            margin-right: 25px;
        }

        .navbar-brand i {
            font-size: 18px;
        }

        .navbar-nav .nav-link {
            color: #555;
            font-size: 14px;
            padding: 12px 10px;
        }

        .navbar-nav .nav-link:hover {
            color: #222;
        }

        .search-form {
            width: 220px;
            margin-left: 20px;
        }

        .search-form .form-control {
            height: 38px;
            border-radius: 4px 0 0 4px;
            border: 1px solid #e5e5e5;
            font-size: 14px;
        }

        .search-form .btn {
            width: 45px;
            height: 38px;
            padding: 0;
            border: none;
            border-radius: 0 4px 4px 0;
            background: #343a40;
            color: white;
        }

        .login {
            color: #555;
            text-decoration: none;
            font-size: 14px;
            margin-left: auto;
        }

        .login:hover {
            color: #222;
        }

        .navbar-toggler {
            border: 1px solid #777;
            padding: 7px 10px;
            border-radius: 5px;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 991.98px) {
            body {
                padding: 20px;
            }

            .navbar {
                padding: 8px 15px;
            }

            .navbar-collapse {
                padding-top: 10px;
            }

            .navbar-nav .nav-link {
                padding: 12px 10px;
                border-bottom: 1px solid #f0f0f0;
            }

            .search-form {
                width: 100%;
                margin: 10px 0;
            }

            .login {
                display: block;
                padding: 12px 10px;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <a class="navbar-brand" href="#">
            <i class="bi bi-compass"></i>
            ◉
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainMenu"
            aria-controls="mainMenu"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Profile
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Messages
                    </a>

                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" href="#">Inbox</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">Sent</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">Drafts</a>
                        </li>
                    </ul>
                </li>

            </ul>

            <form class="d-flex search-form">

                <input
                    class="form-control"
                    type="search"
                    placeholder="Search"
                    aria-label="Search">

                <button class="btn" type="submit">
                    <span>⌕</span>
                </button>

            </form>

            <a href="#" class="login">
                Login
            </a>

        </div>

    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
