<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài 2.1 - Breadcrumb</title>
    <!-- Bootstrap CSS 5.3.3 chuẩn (đã sửa link nạp giao diện) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <div class="container bg-white p-4 rounded border">
        <!-- Tiêu đề theo đúng mẫu bài học -->
        <h5 class="fw-bold mb-3">Đường dẫn chuyên mục:</h5>

        <!-- Breadcrumb hiển thị hàng ngang -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="#">Thư viện</a></li>
                <li class="breadcrumb-item"><a href="#">Giáo trình</a></li>
                <li class="breadcrumb-item active" aria-current="page">Thiết kế giao diện Web</li>
            </ol>
        </nav>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
