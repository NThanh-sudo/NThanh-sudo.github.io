<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài 2.5 - Màu nền theo ngữ cảnh</title>
    <!-- Bootstrap CSS v5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <div class="container bg-white p-4 rounded border">
        <h4 class="fw-bold mb-3">Bài 2.5: Tạo màu nền theo ngữ cảnh</h4>
        <h5 class="fw-bold">Màu nền theo ngữ cảnh</h5>
        <p class="text-muted">Sử dụng các class màu nền theo ngữ cảnh.</p>

        <!-- Các khối hiển thị màu nền chuẩn theo sách giáo trình -->
        <div class="p-3 mb-2 bg-primary text-white rounded">
            Văn bản quan trọng.
        </div>

        <div class="p-3 mb-2 bg-success text-white rounded">
            Văn bản chỉ ra sự thành công.
        </div>

        <div class="p-3 mb-2 bg-info text-dark rounded">
            Văn bản chứa thông tin.
        </div>

        <div class="p-3 mb-2 bg-warning text-dark rounded">
            Văn bản bị cảnh báo.
        </div>

        <div class="p-3 mb-2 bg-danger text-white rounded">
            Văn bản thông báo sự nguy hiểm.
        </div>

        <div class="p-3 mb-2 bg-secondary text-white rounded">
            Màu nền phụ.
        </div>

        <div class="p-3 mb-2 bg-dark text-white rounded">
            Màu nền xám đen.
        </div>

        <div class="p-3 mb-2 bg-light text-dark border rounded">
            Màu nền xám trắng.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
